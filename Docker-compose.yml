version: '3.8'

services:
  webapp:
    image: nginx:alpine
    container_name: servidor_web
    ports:
      - "8080:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - red_interna
    depends_on:
      - wordpress

  wordpress:
    image: wordpress:fpm-alpine
    container_name: servidor_wordpress
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: mi_base_datos
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: password_seguro
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - red_interna
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: servidor_bd
    environment:
      MYSQL_ROOT_PASSWORD: password_seguro
      MYSQL_DATABASE: mi_base_datos
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red_interna

networks:
  red_interna:
    driver: bridge

volumes:
  db_data:
  wordpress_data: