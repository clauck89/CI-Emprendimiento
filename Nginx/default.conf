server {
    listen 80;
    server_name localhost;
    
    # Esta es la ruta interna donde están los archivos de WordPress compartidos en el volumen
    root /var/www/html;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Bloque para procesar PHP a través del contenedor de WordPress
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Redirige el tráfico al servicio "wordpress" por el puerto 9000
        fastcgi_pass wordpress:9000;
        
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}