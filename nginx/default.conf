server {
    listen 80;
    server_name localhost;

    # Compresión Gzip para reducir consumo de ancho de banda en zonas rurales
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml;

    # Encabezados básicos de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint de salud ligero para monitoreo y CI
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"veredacode-nginx"}';
    }

    # ==========================================================
    # 1. API REST Headless WordPress (/wp-json/...)
    # Enrutado con rest_route para funcionar incluso sin permalinks activos
    # ==========================================================
    location ~ ^/wp-json/?(.*)$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param QUERY_STRING rest_route=/$1&$args;
        fastcgi_read_timeout 60s;
    }

    # ==========================================================
    # 2. Panel de administración y archivos de WordPress Headless
    # Accesible para docentes/administradores en /wp-admin y /wp-login.php
    # ==========================================================
    location = /wp-admin {
        return 301 /wp-admin/;
    }

    location ^~ /wp-admin/ {
        root /var/www/html;
        index index.php;
        try_files $uri $uri/ /wp-admin/index.php?$args;

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include fastcgi_params;
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }

    location ~ ^/(wp-login\.php|wp-cron\.php|wp-activate\.php|wp-signup\.php)$ {
        root /var/www/html;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    }

    location ^~ /wp-content/ {
        root /var/www/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /wp-includes/ {
        root /var/www/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ==========================================================
    # 3. Frontend SPA / PWA (Vue 3 + Vite) servido como estáticos
    # ==========================================================
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}